<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET-UG Clinical Revision &amp; Exam Trainer | 40-Unit NMC 2026 Syllabus</title>
<style>
  :root, [data-theme="light"] {
    /* Clinical Daylight Medical & Academic Textbook Palette (Default) */
    --bg-base: #f4f7f9;
    --bg-panel: #ffffff;
    --bg-card: #f8fafc;
    --bg-hover: #eef2f6;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border: #cbd5e1;
    --accent: #0f766e;         /* Clinical Medical Teal */
    --accent-fg: #ffffff;
    --accent-dim: #ccfbf1;

    /* 4 Pictographic Memory Block Colors — Crisp Medical Chart Tints */
    --blue-bg: #f0f7ff;
    --blue-bd: #1d4ed8;
    --blue-tx: #1e40af;

    --red-bg: #fff1f2;
    --red-bd: #be123c;
    --red-tx: #9f1239;

    --green-bg: #ecfdf5;
    --green-bd: #047857;
    --green-tx: #065f46;

    --amber-bg: #fffbeb;
    --amber-bd: #b45309;
    --amber-tx: #92400e;

    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  }

  [data-theme="dark"] {
    --bg-base: #0f172a;
    --bg-panel: #1e293b;
    --bg-card: #263449;
    --bg-hover: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --accent: #14b8a6;
    --accent-fg: #042f2e;
    --accent-dim: rgba(20, 184, 166, 0.16);

    --blue-bg: rgba(29, 78, 216, 0.12);
    --blue-bd: #3b82f6;
    --blue-tx: #93c5fd;

    --red-bg: rgba(190, 18, 60, 0.12);
    --red-bd: #f43f5e;
    --red-tx: #fda4af;

    --green-bg: rgba(4, 120, 87, 0.12);
    --green-bd: #10b981;
    --green-tx: #6ee7b7;

    --amber-bg: rgba(180, 83, 9, 0.12);
    --amber-bd: #f59e0b;
    --amber-tx: #fcd34d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-sans);
    line-height: 1.5;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top Clinical Tactical Header */
  header.topbar {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-badge {
    background: var(--accent);
    color: var(--accent-fg);
    font-family: var(--font-mono);
    font-weight: 800;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .brand-title {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.2px;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  /* Navigation Tabs */
  nav.nav-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 7px 13px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn:hover { background: var(--bg-hover); color: var(--text-main); }
  .tab-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: var(--accent);
  }
  .tab-count {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 99px;
    background: var(--bg-card);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn {
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
    font-weight: 700;
  }
  .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn-danger {
    background: var(--red-bg);
    color: var(--red-tx);
    border-color: var(--red-bd);
  }
  .btn-amber {
    background: var(--amber-bg);
    color: var(--amber-tx);
    border-color: var(--amber-bd);
  }
  .btn-green {
    background: var(--green-bg);
    color: var(--green-tx);
    border-color: var(--green-bd);
  }

  /* Main Container */
  main.workspace {
    max-width: 1480px;
    width: 100%;
    margin: 0 auto;
    padding: 18px 20px 48px;
    flex: 1;
  }

  /* Radar & KPI Strip */
  .radar-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .radar-box {
    border-radius: 8px;
    padding: 14px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
  }
  .radar-box.crit { border-left: 4px solid var(--red-bd); background: var(--red-bg); }
  .radar-box.due  { border-left: 4px solid var(--amber-bd); background: var(--amber-bg); }
  .radar-box.lock { border-left: 4px solid var(--green-bd); background: var(--green-bg); }

  .radar-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .radar-title {
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    font-family: var(--font-mono);
  }
  .crit .radar-title { color: var(--red-tx); }
  .due .radar-title  { color: var(--amber-tx); }
  .lock .radar-title { color: var(--green-tx); }

  .radar-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .radar-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 120px;
    overflow-y: auto;
  }
  .unit-pill {
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-main);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .unit-pill:hover { border-color: var(--accent); color: var(--accent); }

  /* Filter Toolbar */
  .toolbar {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .seg-group {
    display: inline-flex;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .seg-btn {
    background: transparent;
    color: var(--text-muted);
    border: none;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .seg-btn.active {
    background: var(--accent);
    color: var(--accent-fg);
    font-weight: 700;
  }
  .search-input {
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 13px;
    min-width: 240px;
  }

  /* 40-Unit Matrix Grid */
  .section-hdr {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--accent);
    margin: 18px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .unit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 12px;
  }
  .unit-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    transition: border-color 0.15s ease;
  }
  .unit-card:hover { border-color: var(--accent); }
  .unit-card.st-crit { border-left: 4px solid var(--red-bd); }
  .unit-card.st-due  { border-left: 4px solid var(--amber-bd); }
  .unit-card.st-lock { border-left: 4px solid var(--green-bd); }

  .uc-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .uc-id {
    font-family: var(--font-mono);
    font-weight: 800;
    font-size: 12px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border);
  }
  .uc-badges { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .badge {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .badge-crit { background: var(--red-bg); color: var(--red-tx); border: 1px solid var(--red-bd); }
  .badge-due  { background: var(--amber-bg); color: var(--amber-tx); border: 1px solid var(--amber-bd); }
  .badge-lock { background: var(--green-bg); color: var(--green-tx); border: 1px solid var(--green-bd); }
  .badge-mock { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); }
  .badge-neutral { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); }

  .uc-name { font-weight: 700; font-size: 14.5px; line-height: 1.3; }
  .uc-syl {
    font-size: 12px;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .uc-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    padding-top: 6px;
    border-top: 1px dashed var(--border);
  }
  .uc-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  /* Mock Syllabus Lock View */
  .mock-layout {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 16px;
  }
  @media (max-width: 960px) { .mock-layout { grid-template-columns: 1fr; } }
  .panel-box {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .check-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 7px;
    margin-top: 10px;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 9px;
    border-radius: 5px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 12.5px;
    user-select: none;
  }
  .check-item.checked {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .parser-textarea {
    width: 100%;
    min-height: 150px;
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    margin: 10px 0;
    resize: vertical;
  }

  /* Notes View & 4-Block Pictographic Memory Sheet */
  .notes-bar {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .unit-select {
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13.5px;
    min-width: 290px;
  }
  .blind-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 13px;
    border-radius: 6px;
    border: 1px solid var(--amber-bd);
    background: var(--amber-bg);
    color: var(--amber-tx);
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
  }
  .blind-toggle.active {
    background: var(--amber-bd);
    color: #030712;
  }

  /* Active Blind-Recall Blur */
  .blind-active .recall-target:not(.revealed) {
    filter: blur(6px);
    background: rgba(148, 163, 184, 0.18);
    border-radius: 3px;
    cursor: pointer;
    user-select: none;
    transition: filter 0.15s ease;
  }
  .blind-active .recall-target:not(.revealed):hover {
    filter: blur(3.5px);
  }
  .recall-target.revealed {
    filter: none;
    outline: 1px dashed var(--amber-bd);
    border-radius: 3px;
  }

  .sheet-unit-banner {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .sheet-unit-title { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
  .sheet-unit-syl { font-size: 12.5px; color: var(--text-muted); }

  .memory-block {
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
  }
  .block-blue  { background: var(--blue-bg);  border-color: var(--blue-bd); }
  .block-red   { background: var(--red-bg);   border-color: var(--red-bd); }
  .block-green { background: var(--green-bg); border-color: var(--green-bd); }
  .block-amber { background: var(--amber-bg); border-color: var(--amber-bd); }

  .block-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .block-title {
    font-family: var(--font-mono);
    font-weight: 800;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .block-blue .block-title  { color: var(--blue-tx); }
  .block-red .block-title   { color: var(--red-tx); }
  .block-green .block-title { color: var(--green-tx); }
  .block-amber .block-title { color: var(--amber-tx); }

  /* Block 1: Blue Formula Matrix Cards */
  .formula-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 10px;
  }
  .f-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue-bd);
    border-radius: 6px;
    padding: 11px 13px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .f-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .f-name { font-weight: 700; font-size: 13px; color: var(--blue-tx); }
  .f-unit { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); background: var(--bg-card); padding: 1px 6px; border-radius: 4px; }
  .f-eq {
    font-family: var(--font-mono);
    font-size: 13.5px;
    font-weight: 700;
    padding: 6px 8px;
    background: var(--bg-card);
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  .f-sign { font-size: 12px; color: var(--text-muted); }
  .f-bound {
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 4px;
    background: var(--red-bg);
    border-left: 2px solid var(--red-bd);
    color: var(--text-main);
  }

  /* Block 2: Red Trap & NCERT Exception Vault */
  .trap-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 10px;
  }
  .t-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red-bd);
    border-radius: 6px;
    padding: 11px 13px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .t-stmt { font-weight: 700; font-size: 13px; }
  .t-cause {
    font-size: 12px;
    color: var(--text-muted);
    padding-top: 5px;
    border-top: 1px dashed var(--border);
  }

  /* Block 3: Green Visual Algorithm / Reaction Flowcharts */
  .flow-stack { display: flex; flex-direction: column; gap: 12px; }
  .flow-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green-bd);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .flow-title { font-weight: 700; font-size: 13px; color: var(--green-tx); margin-bottom: 10px; }
  .flow-chain {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .flow-node {
    background: var(--bg-card);
    border: 1px solid var(--green-bd);
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .flow-arrow { color: var(--green-tx); font-family: var(--font-mono); font-weight: 800; }
  .flow-tree { display: flex; flex-direction: column; gap: 8px; }
  .flow-root {
    align-self: flex-start;
    background: var(--green-bg);
    border: 1px solid var(--green-bd);
    color: var(--green-tx);
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 5px;
    font-size: 12.5px;
  }
  .flow-branches {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 8px;
    padding-left: 12px;
    border-left: 2px solid var(--green-bd);
  }
  .flow-branch {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 10px;
  }
  .flow-cond {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--amber-tx);
    margin-bottom: 5px;
  }

  /* Block 4: Amber Practical & Experimental Trigger + Quick Order/Pair Reference */
  .lab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .l-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--amber-bd);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .l-title { font-weight: 700; font-size: 12.5px; color: var(--amber-tx); margin-bottom: 4px; }
  .l-desc { font-size: 12px; color: var(--text-main); }

  .order-strip {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 8px;
  }
  .ord-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
  }
  .ord-q { font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }
  .ord-seq { font-family: var(--font-mono); font-weight: 700; font-size: 12.5px; color: var(--accent); }

  /* Interactive Short-Notes Replacement Upgrades */
  .page-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .page-pill {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 700;
    padding: 6px 11px;
    border-radius: 6px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .page-pill:hover, .page-pill.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }
  .notes-page-sheet {
    position: relative;
    margin-bottom: 22px;
  }
  .page-ribbon {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 14px;
    border-radius: 8px 8px 0 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
  }
  .notes-page-sheet .memory-block {
    border-top-left-radius: 0;
    border-top-right-radius: 0;
    margin-bottom: 0;
  }

  /* Interactive Mastery Check & Star Pin on Every Card */
  .card-tools {
    display: inline-flex;
    gap: 5px;
    align-items: center;
  }
  .tool-chip {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
  }
  .tool-chip:hover { border-color: var(--accent); color: var(--text-main); }
  .tool-chip.starred { background: var(--amber-bg); border-color: var(--amber-bd); color: var(--amber-tx); font-weight: 700; }
  .tool-chip.mastered { background: var(--green-bg); border-color: var(--green-bd); color: var(--green-tx); font-weight: 700; }
  .item-mastered { opacity: 0.62; }

  /* Interactive Formula Sandbox Widget */
  .sandbox-box {
    margin-top: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--blue-bd);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .sandbox-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  /* Interactive Order Scramble Trainer */
  .scramble-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
  }
  .scr-chip {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-main);
    cursor: pointer;
  }
  .scr-chip.picked { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
  .scr-chip.wrong-pick { border-color: var(--red-bd); background: var(--red-bg); color: var(--red-tx); }

  /* Interactive NCERT Statement Truth-vs-Myth Spotter Table */
  .stmt-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 8px;
  }
  .stmt-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
  }
  .stmt-card.revealed-true { border-left: 3px solid var(--green-bd); background: var(--green-bg); }
  .stmt-card.revealed-false { border-left: 3px solid var(--red-bd); background: var(--red-bg); }

  /* Personal Sticky Notes Area */
  .sticky-notes-area {
    width: 100%;
    min-height: 74px;
    background: var(--bg-panel);
    color: var(--text-main);
    border: 1px dashed var(--amber-bd);
    border-radius: 6px;
    padding: 9px 11px;
    font-family: var(--font-sans);
    font-size: 12.5px;
    resize: vertical;
    margin-top: 6px;
  }

  /* Cognitive Reflex Drill & 3-Round Exam Trainer */
  .drill-header {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .pace-wrap {
    width: 100%;
    height: 7px;
    background: var(--bg-card);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .pace-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.25s linear, background-color 0.25s ease;
  }
  .pace-bar.warn { background: var(--amber-bd); }
  .pace-bar.over { background: var(--red-bd); }

  .drill-layout {
    display: grid;
    grid-template-columns: 1fr 270px;
    gap: 16px;
  }
  @media (max-width: 960px) { .drill-layout { grid-template-columns: 1fr; } }

  .q-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .q-stem {
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.55;
    margin-bottom: 16px;
  }
  .q-stem .arl {
    color: var(--accent);
    font-family: var(--font-mono);
    font-weight: 800;
  }
  .q-stem .ctx {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--amber-tx);
    background: var(--amber-bg);
    border: 1px solid var(--amber-bd);
    padding: 2px 7px;
    border-radius: 4px;
    margin-bottom: 4px;
  }

  .opt-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-bottom: 16px;
  }
  .opt-btn {
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 12px 14px;
    text-align: left;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: all 0.12s ease;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--bg-hover); }
  .opt-key {
    font-family: var(--font-mono);
    font-weight: 800;
    font-size: 12px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
  }
  .opt-btn.correct {
    border-color: var(--green-bd);
    background: var(--green-bg);
  }
  .opt-btn.wrong {
    border-color: var(--red-bd);
    background: var(--red-bg);
  }

  .sol-box {
    margin-top: 14px;
    padding: 14px;
    border-radius: 7px;
    background: var(--bg-card);
    border-left: 4px solid var(--accent);
  }
  .sol-steps {
    margin-top: 8px;
    padding-left: 18px;
    font-size: 13px;
  }
  .sol-steps li { margin-bottom: 4px; }

  .palette-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .pal-btn {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    padding: 7px 0;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-main);
    cursor: pointer;
  }
  .pal-btn.cur { outline: 2px solid var(--accent); }
  .pal-btn.ok  { background: var(--green-bg); border-color: var(--green-bd); color: var(--green-tx); }
  .pal-btn.err { background: var(--red-bg); border-color: var(--red-bd); color: var(--red-tx); }
  .pal-btn.r2  { background: var(--amber-bg); border-color: var(--amber-bd); color: var(--amber-tx); }

  /* Dedicated 3-Page Printable PDF Stylesheet */
  @media print {
    @page { size: A4 portrait; margin: 9mm 10mm; }
    html, body {
      background: #ffffff !important;
      color: #000000 !important;
      font-size: 9.5pt !important;
      line-height: 1.32 !important;
    }
    header.topbar, .no-print, .notes-bar { display: none !important; }
    main.workspace { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
    .blind-active .recall-target { filter: none !important; background: transparent !important; }
    .memory-block, .f-card, .t-card, .flow-card, .l-card, .ord-card {
      background: #ffffff !important;
      color: #000000 !important;
      border-color: #334155 !important;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .formula-grid, .trap-grid, .lab-grid, .order-strip {
      grid-template-columns: 1fr 1fr !important;
      gap: 6px !important;
    }
    .print-page-break {
      page-break-before: always !important;
      break-before: page !important;
    }
  }
</style>
</head>
