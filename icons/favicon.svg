<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#021a19" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle tactical ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="16 8" />

  <!-- Atomic Orbital 1 (Tilted -32 deg) -->
  <g transform="rotate(-32 256 256)">
    <ellipse cx="256" cy="256" rx="200" ry="72" fill="none" stroke="#5eead4" stroke-width="8" stroke-opacity="0.45" />
    <circle cx="456" cy="256" r="14" fill="#38bdf8" />
    <circle cx="56" cy="256" r="14" fill="#38bdf8" />
  </g>

  <!-- Atomic Orbital 2 (Tilted +32 deg) -->
  <g transform="rotate(32 256 256)">
    <ellipse cx="256" cy="256" rx="200" ry="72" fill="none" stroke="#5eead4" stroke-width="8" stroke-opacity="0.45" />
    <circle cx="456" cy="256" r="14" fill="#f43f5e" />
    <circle cx="56" cy="256" r="14" fill="#f43f5e" />
  </g>

  <!-- Clinical Medical Cross with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="216" y="112" width="80" height="288" rx="20" fill="#ffffff" />
    <!-- Horizontal Bar -->
    <rect x="112" y="216" width="288" height="80" rx="20" fill="#ffffff" />
  </g>

  <!-- High-Voltage Lightning Reflex Bolt -->
  <path d="M 280 125 L 210 262 L 254 262 L 232 387 L 306 248 L 262 248 Z" 
        fill="url(#boltGrad)" stroke="#b45309" stroke-width="4" stroke-linejoin="round" />
</svg>
